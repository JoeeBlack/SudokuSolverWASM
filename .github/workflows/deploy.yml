name: Wdrożenie na GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja oficjalnego środowiska Emscripten (emsdk)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          "${RUNNER_TEMP}/emsdk/emsdk" install latest
          "${RUNNER_TEMP}/emsdk/emsdk" activate latest

      - name: Kompilacja WebAssembly i przygotowanie katalogu dist
        run: |
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          make all

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Wysłanie artefaktu GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publikacja na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
